name: Hospital AI - CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút kích hoạt thủ công trên GitHub UI

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. CI - Kiểm thử & Build Backend (.NET 9 Microservices)
  # ────────────────────────────────────────────────────────────
  backend-ci:
    name: Build .NET 9 Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/backend/HospitalAI.sln

      - name: Build Backend (Release)
        run: dotnet build src/backend/HospitalAI.sln --configuration Release --no-restore

  # ────────────────────────────────────────────────────────────
  # 2. CI - Kiểm thử & Build Frontend Web Admin (React + Vite)
  # ────────────────────────────────────────────────────────────
  frontend-ci:
    name: Build Web Admin Portal
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/web-admin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/web-admin/package-lock.json

      - name: Install Node Modules
        run: npm ci

      - name: Build Web Production
        run: npm run build

  # ────────────────────────────────────────────────────────────
  # 3. CD - Tự động Triển khai lên AWS EC2 (Continuous Deploy)
  # ────────────────────────────────────────────────────────────
  deploy-aws:
    name: Deploy to AWS EC2
    needs: [ backend-ci, frontend-ci ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check AWS Secrets Configuration
        id: check_secrets
        run: |
          if [ -z "${{ secrets.AWS_EC2_HOST }}" ] || [ -z "${{ secrets.AWS_EC2_SSH_KEY }}" ]; then
            echo "::warning ::Chưa cấu hình AWS_EC2_HOST hoặc AWS_EC2_SSH_KEY trong GitHub Secrets. Tạm thời bỏ qua bước Auto-Deploy."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Execute Deploy via SSH on AWS EC2
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER || 'ubuntu' }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: ${{ secrets.AWS_EC2_PORT || 22 }}
          script: |
            echo "🚀 Bắt đầu quá trình cập nhật mã nguồn trên máy chủ AWS EC2..."
            
            # Điều hướng vào thư mục dự án (hỗ trợ cả ~/Hospital_AI hoặc /home/ubuntu/Hospital_AI)
            PROJECT_DIR="${{ secrets.AWS_PROJECT_DIR || '~/Hospital_AI' }}"
            eval cd $PROJECT_DIR || exit 1
            
            echo "📥 Kéo mã nguồn mới nhất từ GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🐳 Tái tạo và khởi chạy lại các Docker Containers..."
            docker compose up -d --build
            
            echo "🧹 Dọn dẹp images cũ không sử dụng..."
            docker image prune -f
            
            echo "✅ Triển khai hoàn tất thành công!"
