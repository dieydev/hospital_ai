services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hospitalai-sqlserver
    ports:
      - "14333:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:?Configure SQL_SA_PASSWORD in .env}
      - MSSQL_PID=Developer
      - MSSQL_MEMORY_LIMIT_MB=1400
    deploy:
      resources:
        limits:
          memory: 1800M
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - hospitalai_network
    restart: unless-stopped

  identity-service:
    container_name: hospitalai-identity-service
    build:
      context: ./src/backend
      dockerfile: services/HospitalAI.IdentityService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_gcServer=0
      - DOTNET_GCHeapHardLimitPercent=75
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HospitalAI_DB;User Id=sa;Password=${SQL_SA_PASSWORD:?Configure SQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true;Max Pool Size=100;Min Pool Size=5;Connect Timeout=30;ConnectRetryCount=3;ConnectRetryInterval=5;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY in .env}
      - JwtSettings__Issuer=HospitalAI.Backend
      - JwtSettings__Audience=HospitalAI.Clients
      - DATA_DIR=/app/data
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - SEED_DEFAULT_PASSWORD=${SEED_DEFAULT_PASSWORD:-}
    volumes:
      - queue_data:/app/data
    deploy:
      resources:
        limits:
          memory: 450M
    networks:
      - hospitalai_network
    depends_on:
      - sqlserver
    restart: unless-stopped

  patient-service:
    container_name: hospitalai-patient-service
    build:
      context: ./src/backend
      dockerfile: services/HospitalAI.PatientService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_gcServer=0
      - DOTNET_GCHeapHardLimitPercent=75
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HospitalAI_DB;User Id=sa;Password=${SQL_SA_PASSWORD:?Configure SQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true;Max Pool Size=100;Min Pool Size=5;Connect Timeout=30;ConnectRetryCount=3;ConnectRetryInterval=5;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY in .env}
      - JwtSettings__Issuer=HospitalAI.Backend
      - JwtSettings__Audience=HospitalAI.Clients
      - DATA_DIR=/app/data
    volumes:
      - queue_data:/app/data
    deploy:
      resources:
        limits:
          memory: 400M
    networks:
      - hospitalai_network
    depends_on:
      - sqlserver
    restart: unless-stopped

  queue-service:
    container_name: hospitalai-queue-service
    build:
      context: ./src/backend
      dockerfile: services/HospitalAI.QueueService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_gcServer=0
      - DOTNET_GCHeapHardLimitPercent=75
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HospitalAI_DB;User Id=sa;Password=${SQL_SA_PASSWORD:?Configure SQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true;Max Pool Size=100;Min Pool Size=5;Connect Timeout=30;ConnectRetryCount=3;ConnectRetryInterval=5;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY in .env}
      - JwtSettings__Issuer=HospitalAI.Backend
      - JwtSettings__Audience=HospitalAI.Clients
      - Kiosk__Terminals__0__TerminalId=KIOSK-SANH-A-01
      - Kiosk__Terminals__0__TerminalName=Kiosk Sảnh A - Tiếp Nhận & Khám Bệnh
      - Kiosk__Terminals__0__Location=Sảnh A - Tầng Trệt
      - Kiosk__Terminals__0__ZoneType=Reception
      - Kiosk__Terminals__0__Secret=${KIOSK_SECRET_A01:?Configure KIOSK_SECRET_A01 in .env}
      - Kiosk__Terminals__1__TerminalId=KIOSK-TAI-KHAM-02
      - Kiosk__Terminals__1__TerminalName=Kiosk Sảnh B - Tái Khám Theo Hẹn
      - Kiosk__Terminals__1__Location=Sảnh B - Tầng 1
      - Kiosk__Terminals__1__ZoneType=FollowUp
      - Kiosk__Terminals__1__Secret=${KIOSK_SECRET_B02:?Configure KIOSK_SECRET_B02 in .env}
      - Kiosk__Terminals__2__TerminalId=KIOSK-CLS-03
      - Kiosk__Terminals__2__TerminalName=Kiosk Khu Cận Lâm Sàng - Trả Kết Quả
      - Kiosk__Terminals__2__Location=Khu Cận Lâm Sàng - Tầng 2
      - Kiosk__Terminals__2__ZoneType=Paraclinical
      - Kiosk__Terminals__2__Secret=${KIOSK_SECRET_C03:?Configure KIOSK_SECRET_C03 in .env}
      - PaymentQr__Environment=${SEPAY_ENVIRONMENT:-Sandbox}
      - PaymentQr__BankCode=${SEPAY_BANK_CODE:-MB}
      - PaymentQr__BankBin=${SEPAY_BANK_BIN:-970422}
      - PaymentQr__AccountNumber=${SEPAY_ACCOUNT_NUMBER:-0000000001}
      - PaymentQr__AccountName=${SEPAY_ACCOUNT_NAME:-HOSPITAL AI DEMO}
      - PaymentQr__PaymentPrefix=${SEPAY_PAYMENT_PREFIX:-HAI}
      - DATA_DIR=/app/data
    volumes:
      - queue_data:/app/data
    deploy:
      resources:
        limits:
          memory: 400M
    networks:
      - hospitalai_network
    depends_on:
      - sqlserver
    restart: unless-stopped

  examination-service:
    container_name: hospitalai-examination-service
    build:
      context: ./src/backend
      dockerfile: services/HospitalAI.ExaminationService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_gcServer=0
      - DOTNET_GCHeapHardLimitPercent=75
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HospitalAI_DB;User Id=sa;Password=${SQL_SA_PASSWORD:?Configure SQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true;Max Pool Size=100;Min Pool Size=5;Connect Timeout=30;ConnectRetryCount=3;ConnectRetryInterval=5;
      - MongoDb__ConnectionString=mongodb://${MONGO_INITDB_ROOT_USERNAME:-hospitalai_admin}:${MONGO_INITDB_ROOT_PASSWORD:?Configure MONGO_INITDB_ROOT_PASSWORD in .env}@mongodb:27017/HospitalAI_AI_Logs?authSource=admin
      - MongoDb__DatabaseName=HospitalAI_AI_Logs
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY in .env}
      - JwtSettings__Issuer=HospitalAI.Backend
      - JwtSettings__Audience=HospitalAI.Clients
      - DigitalSignature__SecretKey=${DIGITAL_SIGNATURE_SECRET:?Configure DIGITAL_SIGNATURE_SECRET in .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATA_DIR=/app/data
      - Vnpay__TmnCode=${VNPAY_TMN_CODE:-}
      - Vnpay__HashSecret=${VNPAY_HASH_SECRET:-}
      - Vnpay__BaseUrl=${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      - Vnpay__Command=pay
      - Vnpay__CurrCode=VND
      - Vnpay__Version=2.1.0
      - Vnpay__Locale=vn
      - Vnpay__ReturnUrl=${VNPAY_RETURN_URL:-https://dmedical.site/api/payment/vnpay-return}
      - Sepay__Environment=${SEPAY_ENVIRONMENT:-Sandbox}
      - Sepay__BankCode=${SEPAY_BANK_CODE:-MB}
      - Sepay__BankBin=${SEPAY_BANK_BIN:-970422}
      - Sepay__AccountNumber=${SEPAY_ACCOUNT_NUMBER:-0000000001}
      - Sepay__AccountName=${SEPAY_ACCOUNT_NAME:-HOSPITAL AI DEMO}
      - Sepay__PaymentPrefix=${SEPAY_PAYMENT_PREFIX:-HAI}
      - Sepay__WebhookSecret=${SEPAY_WEBHOOK_SECRET:-}
      - Sepay__TimestampToleranceSeconds=${SEPAY_TIMESTAMP_TOLERANCE_SECONDS:-3600}
      - PaymentQr__Environment=${SEPAY_ENVIRONMENT:-Sandbox}
      - PaymentQr__BankCode=${SEPAY_BANK_CODE:-MB}
      - PaymentQr__BankBin=${SEPAY_BANK_BIN:-970422}
      - PaymentQr__AccountNumber=${SEPAY_ACCOUNT_NUMBER:-0000000001}
      - PaymentQr__AccountName=${SEPAY_ACCOUNT_NAME:-HOSPITAL AI DEMO}
      - PaymentQr__PaymentPrefix=${SEPAY_PAYMENT_PREFIX:-HAI}
    volumes:
      - queue_data:/app/data
    deploy:
      resources:
        limits:
          memory: 450M
    networks:
      - hospitalai_network
    depends_on:
      - sqlserver
      - mongodb
    restart: unless-stopped

  api-gateway:
    container_name: hospitalai-api-gateway
    build:
      context: ./src/backend
      dockerfile: services/HospitalAI.Gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_gcServer=0
      - DOTNET_GCHeapHardLimitPercent=75
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 400M
    networks:
      - hospitalai_network
    depends_on:
      - identity-service
      - patient-service
      - queue-service
      - examination-service
    restart: unless-stopped

  web-admin:
    container_name: hospitalai-web-admin
    build:
      context: ./src/web-admin
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 250M
    networks:
      - hospitalai_network
    depends_on:
      - api-gateway
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: hospitalai-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=hospitalai_admin
      - MONGO_INITDB_ROOT_PASSWORD=HospitalAIMongo2026SecurePass
      - MONGO_INITDB_DATABASE=HospitalAI_AI_Logs
    deploy:
      resources:
        limits:
          memory: 450M
    volumes:
      - mongo_data:/data/db
    networks:
      - hospitalai_network
    restart: unless-stopped

networks:
  hospitalai_network:
    name: hospital_ai_hospitalai_network
    driver: bridge

volumes:
  mssql_data:
  mongo_data:
  queue_data:
