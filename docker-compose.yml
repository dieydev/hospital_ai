services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hospitalai-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=@Duy12345
      - MSSQL_PID=Developer
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - hospitalai_network
    restart: always

  identity-service:
    container_name: hospitalai-identity-service
    build:
      context: ./src/backend
      dockerfile: services/HospitalAI.IdentityService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HospitalAI_DB;User Id=sa;Password=@Duy12345;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - JwtSettings__SecretKey=SUPER_SECRET_HOSPITAL_AI_KEY_2026_DATN_THU_DAU_MOT
      - JwtSettings__Issuer=HospitalAI.Backend
      - JwtSettings__Audience=HospitalAI.Clients
      - Authentication__Google__ClientId=522428211167-ei79mb8vac5spld5m3djc4jes5llgken.apps.googleusercontent.com
    networks:
      - hospitalai_network
    depends_on:
      - sqlserver
    restart: always

  patient-service:
    container_name: hospitalai-patient-service
    build:
      context: ./src/backend
      dockerfile: services/HospitalAI.PatientService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HospitalAI_DB;User Id=sa;Password=@Duy12345;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - JwtSettings__SecretKey=SUPER_SECRET_HOSPITAL_AI_KEY_2026_DATN_THU_DAU_MOT
      - JwtSettings__Issuer=HospitalAI.Backend
      - JwtSettings__Audience=HospitalAI.Clients
    networks:
      - hospitalai_network
    depends_on:
      - sqlserver
    restart: always

  queue-service:
    container_name: hospitalai-queue-service
    build:
      context: ./src/backend
      dockerfile: services/HospitalAI.QueueService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HospitalAI_DB;User Id=sa;Password=@Duy12345;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - JwtSettings__SecretKey=SUPER_SECRET_HOSPITAL_AI_KEY_2026_DATN_THU_DAU_MOT
      - JwtSettings__Issuer=HospitalAI.Backend
      - JwtSettings__Audience=HospitalAI.Clients
    networks:
      - hospitalai_network
    depends_on:
      - sqlserver
    restart: always

  examination-service:
    container_name: hospitalai-examination-service
    build:
      context: ./src/backend
      dockerfile: services/HospitalAI.ExaminationService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HospitalAI_DB;User Id=sa;Password=@Duy12345;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - MongoDb__ConnectionString=mongodb://hospitalai_admin:HospitalAIMongo2026SecurePass@mongodb:27017/HospitalAI_AI_Logs?authSource=admin
      - MongoDb__DatabaseName=HospitalAI_AI_Logs
      - JwtSettings__SecretKey=SUPER_SECRET_HOSPITAL_AI_KEY_2026_DATN_THU_DAU_MOT
      - JwtSettings__Issuer=HospitalAI.Backend
      - JwtSettings__Audience=HospitalAI.Clients
    networks:
      - hospitalai_network
    depends_on:
      - sqlserver
      - mongodb
    restart: always

  api-gateway:
    container_name: hospitalai-api-gateway
    build:
      context: ./src/backend
      dockerfile: services/HospitalAI.Gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "5000:5000"
    networks:
      - hospitalai_network
    depends_on:
      - identity-service
      - patient-service
      - queue-service
      - examination-service
    restart: always

  web-admin:
    container_name: hospitalai-web-admin
    build:
      context: ./src/web-admin
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - hospitalai_network
    depends_on:
      - api-gateway
    restart: always

  mongodb:
    image: mongo:7.0
    container_name: hospitalai-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=hospitalai_admin
      - MONGO_INITDB_ROOT_PASSWORD=HospitalAIMongo2026SecurePass
      - MONGO_INITDB_DATABASE=HospitalAI_AI_Logs
    volumes:
      - mongo_data:/data/db
    networks:
      - hospitalai_network
    restart: always

networks:
  hospitalai_network:
    driver: bridge

volumes:
  mssql_data:
  mongo_data:
