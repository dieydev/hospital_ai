upstream backend_gateway {
    server api-gateway:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # 1. Bật Gzip nén dữ liệu truyền tải (giảm 70% dung lượng JS/CSS)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # 2. Cache vĩnh viễn cho Static Assets (JS, CSS, Ảnh, Font có hash) -> Không tốn tài nguyên tải lại
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # 2B. Phục vụ tải trực tiếp bộ cài Android (.apk) — không rơi vào SPA index.html nếu thiếu file
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="D-Medical-Patient-v1.0.0.apk"' always;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 3. HTML luôn kiểm tra mới nhất nhưng không cache cứng + Security Headers OWASP
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(self), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://img.vietqr.io https://api.dicebear.com https://images.unsplash.com https://lh3.googleusercontent.com https://i.ytimg.com https://img.youtube.com https://api.qrserver.com; media-src 'self' blob: data:; connect-src 'self' ws: wss: https://dmedical.site https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://www.google.com https://accounts.google.com; frame-ancestors 'none'; base-uri 'self';" always;
        try_files $uri $uri/ /index.html;
    }

    # 4. Proxy API với Connection Pooling & Timeouts an toàn
    location /api/ {
        proxy_pass http://backend_gateway/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 5. Proxy SignalR Hubs (Hỗ trợ WebSocket thời gian thực không bị ngắt kết nối)
    location /hubs/ {
        proxy_pass http://backend_gateway/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

